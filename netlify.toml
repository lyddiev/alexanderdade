# No build step: Netlify serves this folder as-is.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# alexanderdade.com/samples shows samples.html (the writing portfolio page).
[[redirects]]
  from = "/samples"
  to = "/samples.html"
  status = 200
  force = true

[[redirects]]
  from = "/samples/"
  to = "/samples.html"
  status = 200
  force = true
